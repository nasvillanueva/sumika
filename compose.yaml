services:
  app:
    image: node:24
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - "2403:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - db
    working_dir: /app
    env_file:
      - path: .env
        required: true

  db:
    image: postgres
    restart: always
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    env_file:
      - path: .env
        required: true


volumes:
  node_modules:
  pgdata:
